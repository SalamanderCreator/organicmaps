# Kartenapp fork: installable arm64 test APK for every pull request.
# Kept in its own file so upstream Organic Maps updates merge without conflicts.
name: Kartenapp Test-APK
on:
  workflow_dispatch: # Manual trigger
  pull_request:
  push:
    branches:
      - master # Populates the ccache that pull requests read

env:
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64

jobs:
  test-apk:
    name: Test-APK (F-Droid Beta, arm64)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 200 # Needed for the versioning script

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KARTENAPP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KARTENAPP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KARTENAPP_KEYSTORE_BASE64 und KARTENAPP_KEYSTORE_PASSWORD fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/app/secure.properties <<EOF
          ext {
            spropStoreFile = 'release.keystore'
            spropStorePassword = '$KEYSTORE_PASSWORD'
            spropKeyAlias = 'kartenapp'
            spropKeyPassword = '$KEYSTORE_PASSWORD'
          }
          EOF

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.workflow }}
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Month of the data files
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Maps&Fly: the flight sites of the last build, used when no source answers this time.
      - name: Restore the flight sites file
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/assets/flight_sites.json
          key: flight-sites-${{ github.run_id }}
          restore-keys: flight-sites-

      - name: Build the flight sites file
        id: flight_sites
        shell: bash
        # ParaglidingEarth and OpenStreetMap paragliding sites for the APK. An unreachable source is left out;
        # without any the last file stays, or the APK has only its test sites.
        run: |
          if timeout 1500 python3 tools/python/flight_sites.py /tmp/flight_sites.json \
              --previous android/app/src/main/assets/flight_sites.json; then
            cp /tmp/flight_sites.json android/app/src/main/assets/flight_sites.json
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ -f android/app/src/main/assets/flight_sites.json ]; then
            echo "::warning::No source answered, the APK keeps the flight sites of an earlier build."
          else
            echo "::warning::No flight sites file, the APK shows only the test sites."
          fi

      - name: Save the flight sites file
        if: steps.flight_sites.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/src/main/assets/flight_sites.json
          key: flight-sites-${{ github.run_id }}

      # Maps&Fly: the OpenStreetMap clearances of the car routing, rebuilt once a month.
      - name: Restore the clearances file
        id: maxheights_cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/assets/maxheights.bin
          key: maxheights-v1-${{ hashFiles('tools/python/maxheights.py') }}-${{ steps.month.outputs.month }}
          restore-keys: maxheights-v1-

      - name: Build the clearances file
        id: maxheights
        if: steps.maxheights_cache.outputs.cache-hit != 'true'
        shell: bash
        # Without an answer from Overpass the file of an earlier build stays, or the car routing ignores clearances.
        run: |
          if timeout 2400 python3 tools/python/maxheights.py /tmp/maxheights.bin; then
            cp /tmp/maxheights.bin android/app/src/main/assets/maxheights.bin
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ -f android/app/src/main/assets/maxheights.bin ]; then
            echo "::warning::Overpass did not answer, the APK keeps the clearances of an earlier build."
          else
            echo "::warning::No clearances file, the car routing ignores clearances."
          fi

      - name: Save the clearances file
        if: steps.maxheights.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/src/main/assets/maxheights.bin
          key: maxheights-v1-${{ hashFiles('tools/python/maxheights.py') }}-${{ steps.month.outputs.month }}

      - name: Compile
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          # The upstream code counts the day's commits of the built branch, so an APK from a branch with fewer
          # commits could not update one from another branch. Use the build time instead: yyMMdd + 30..77 for
          # each half hour (UTC), above any commit count of the day.
          export KARTENAPP_ANDROID_CODE="$(date -u +%y%m%d)$((30 + 10#$(date -u +%H) * 2 + 10#$(date -u +%M) / 30))"
          echo "ANDROID_CODE=$(../tools/unix/version.sh android_code)" >> "$GITHUB_ENV"
          ./gradlew -Parm64 assembleFdroidBeta

      # The file name is the artifact name. Builds of master and of a pull request in the same half hour got
      # the same name, so the commit is part of it.
      - name: Name the test APK
        shell: bash
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          APK="Kartenapp-${ANDROID_CODE}-${COMMIT::7}.apk"
          cp "android/app/build/outputs/apk/fdroid/beta/OrganicMaps-${ANDROID_CODE}-fdroid-beta.apk" "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          archive: false
          if-no-files-found: error
          retention-days: 30
